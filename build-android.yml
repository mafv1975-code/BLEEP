name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore private signing key
        env:
          KEY_BASE64: ${{ secrets.ROAD54_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ROAD54_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY_BASE64" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Add both ROAD54_KEYSTORE_BASE64 and ROAD54_KEYSTORE_PASSWORD repository secrets first.'
            exit 1
          fi
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          chmod 600 "$RUNNER_TEMP/signing.p12"
      - name: Compile and check Android project
        env:
          ROAD54_KEYSTORE_PATH: ${{ runner.temp }}/signing.p12
          ROAD54_KEYSTORE_PASSWORD: ${{ secrets.ROAD54_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify APK and prepare download
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
          mkdir -p download
          cp app/build/outputs/apk/release/app-release.apk download/Road54-Marco-Vieira.apk
          sha256sum download/Road54-Marco-Vieira.apk > download/SHA256.txt
      - name: Upload APK download
        uses: actions/upload-artifact@v4
        with:
          name: Road54-Marco-Vieira-APK
          path: download/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.p12"
